# RetroDeck's library: which folders hold games for which system.
# make-games-folder.sh lays out such folders and, with --use, points the
# four lines at the end here to them.
#
#   <system> <folder> [depth=N] [exclude=pattern,pattern]
#
# system:  plus4, c64, amiga, mega65
# folder:  relative to this file, absolute, or starting with ~; "*" stands
#          for any one folder, in double quotes if it contains spaces
# depth:   how many levels of subfolders are searched (default 3, 0 = only
#          the folder itself)
# exclude: file names to leave out (shell patterns, without spaces)
#
# Files: Plus/4 PRG D64 D81 T64 TAP · C64 PRG D64 D71 D81 G64 T64 TAP CRT ·
# Amiga ADF ADZ DMS · MEGA65 PRG D81 – also inside ZIP archives (unless the
# ZIP lies unpacked next to itself). Amiga disks named "... (Disk 1 of 3)"
# become one game; View + LB/RB changes the disk. A screenshot is taken from
# <name>.png next to the file or from a folder screenshots/ beside it or up
# to two levels above.

plus4   ~/Games/Retro/Plus4
c64     ~/Games/Retro/C64
amiga   ~/Games/Retro/Amiga
mega65  ~/Games/Retro/MEGA65
